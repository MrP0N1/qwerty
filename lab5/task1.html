<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Гаражний розпродаж</title>
  <link rel="stylesheet" href="task1.css">
</head>
<body>
  <input type="checkbox" id="theme-toggle">
  <label for="theme-toggle" class="theme-switch">🌙 Темна / ☀️ Світла</label>

  <div class="page">
    <h1>Гаражний розпродаж</h1>

    <div class="products">
      <div class="product">
        <img src="fairy.jpg" alt="Fairy">
        <h3>Fairy — засіб для миття посуду</h3>
        <p class="price">69 грн</p>
        <div class="stars">
          <input type="radio" id="f5" name="fairy" value="5"><label for="f5">★</label>
          <input type="radio" id="f4" name="fairy" value="4"><label for="f4">★</label>
          <input type="radio" id="f3" name="fairy" value="3"><label for="f3">★</label>
          <input type="radio" id="f2" name="fairy" value="2"><label for="f2">★</label>
          <input type="radio" id="f1" name="fairy" value="1"><label for="f1">★</label>
        </div>
      </div>

      <div class="product">
        <img src="finish.jpg" alt="Finish">
        <h3>пігулки для посудомийної машини </h3>
        <p class="price">910 грн</p>
        <div class="stars">
          <input type="radio" id="fi5" name="finish" value="5"><label for="fi5">★</label>
          <input type="radio" id="fi4" name="finish" value="4"><label for="fi4">★</label>
          <input type="radio" id="fi3" name="finish" value="3"><label for="fi3">★</label>
          <input type="radio" id="fi2" name="finish" value="2"><label for="fi2">★</label>
          <input type="radio" id="fi1" name="finish" value="1"><label for="fi1">★</label>
        </div>
      </div>

      <div class="product">
        <img src="pot.jpg" alt="Каструля">
        <h3>Кастрюля Tramontina Tunis</h3>
        <p class="price">1100 грн</p>
        <div class="stars">
          <input type="radio" id="b5" name="pot" value="5"><label for="b5">★</label>
          <input type="radio" id="b4" name="pot" value="4"><label for="b4">★</label>
          <input type="radio" id="b3" name="pot" value="3"><label for="b3">★</label>
          <input type="radio" id="b2" name="pot" value="2"><label for="b2">★</label>
          <input type="radio" id="b1" name="pot" value="1"><label for="b1">★</label>
        </div>
      </div>

      <div class="product">
        <img src="kettle.jpg" alt="Чайник">
        <h3>Електроний чайник SMEG
</h3>
        <p class="price">860 грн</p>
        <div class="stars">
          <input type="radio" id="k5" name="kettle" value="5"><label for="k5">★</label>
          <input type="radio" id="k4" name="kettle" value="4"><label for="k4">★</label>
          <input type="radio" id="k3" name="kettle" value="3"><label for="k3">★</label>
          <input type="radio" id="k2" name="kettle" value="2"><label for="k2">★</label>
          <input type="radio" id="k1" name="kettle" value="1"><label for="k1">★</label>
        </div>
      </div>

      <div class="product">
        <img src="child_bed.jpg" alt="Дитяче ліжко">
        <h3>Дитяче ліжко для немовлят</h3>
        <p class="price">6100 грн</p>
        <div class="stars">
          <input type="radio" id="cb5" name="child_bed" value="5"><label for="cb5">★</label>
          <input type="radio" id="cb4" name="child_bed" value="4"><label for="cb4">★</label>
          <input type="radio" id="cb3" name="child_bed" value="3"><label for="cb3">★</label>
          <input type="radio" id="cb2" name="child_bed" value="2"><label for="cb2">★</label>
          <input type="radio" id="cb1" name="child_bed" value="1"><label for="cb1">★</label>
        </div>
      </div>

      <div class="product">
        <img src="chair.jpg" alt="Стілець">
        <h3>Стілець рожевий</h3>
        <p class="price">880 грн</p>
        <div class="stars">
          <input type="radio" id="ch5" name="chair" value="5"><label for="ch5">★</label>
          <input type="radio" id="ch4" name="chair" value="4"><label for="ch4">★</label>
          <input type="radio" id="ch3" name="chair" value="3"><label for="ch3">★</label>
          <input type="radio" id="ch2" name="chair" value="2"><label for="ch2">★</label>
          <input type="radio" id="ch1" name="chair" value="1"><label for="ch1">★</label>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
